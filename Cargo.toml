[package]
name = "banana-rs"
version = "0.1.1"
edition = "2021"
description = "Offline photo library: browse your photos grouped by date"
license = "MIT"
repository = "https://github.com/aqibshabbirdev/banana-rs"

[dependencies]
eframe = "0.31"
image = "0.25"
kamadak-exif = "0.6"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
rayon = "1"
rfd = "0.15"
dirs = "6"
tract-onnx = "0.23"
# CLIP tokenizer for search (pure Rust).
regex = "1"
unicode-normalization = "0.1"
# Locked Folder encryption (RustCrypto, pure Rust).
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"
# Import & export: Google Takeout zips, Google Photos Picker (OAuth + HTTPS, rustls).
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5.2.9"

# HEIC/HEIF/AVIF: macOS uses the built-in ImageIO framework; elsewhere the system libheif
# (Linux: libheif-dev >= 1.17). Build without it: cargo build --no-default-features
[target.'cfg(not(target_os = "macos"))'.dependencies]
libheif-rs = { version = "3", default-features = false, features = ["v1_17", "image"], optional = true }
# Video thumbnails and playback off-mac (Linux: libgstreamer1.0-dev, libgstreamer-plugins-base1.0-dev).
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-pbutils = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

# Video on macOS goes through AVFoundation (hardware decoding, audio), nothing to install.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-graphics"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-photos = { version = "0.3", features = ["block2"] }
block2 = "0.6"
# Phones and cameras (iPhone, Android in PTP mode) through Image Capture.
objc2-image-capture-core = { version = "0.3", features = ["ICDeviceBrowser", "ICDevice", "ICCameraDevice", "ICCameraItem", "objc2-core-graphics"] }

[features]
default = ["heic", "video"]
heic = ["dep:libheif-rs"]
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-pbutils", "dep:gstreamer-video"]

[profile.dev.package."*"]
# Image decoding is painfully slow without optimisations, even in debug builds.
opt-level = 3

[profile.release]
lto = "thin"

[dev-dependencies]
# Only for examples/make_doc_prompts.rs, which precomputes the Documents prompt embeddings.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
