# Builds and tests Banana Photos on Windows (x64), and keeps the result as an artifact.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths: ["src/**", "Cargo.*", "assets/**", ".github/workflows/windows.yml", "scripts/*windows*"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # libheif (HEIC) from vcpkg, linked statically into the exe; built packages are cached.
      VCPKG_ROOT: C:\vcpkg
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-libheif-x64-windows-static-md-v1
      - name: libheif
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          vcpkg install libheif:x64-windows-static-md
      - name: Build
        run: cargo build --release --no-default-features --features heic
      - name: Test
        run: cargo test --release --no-default-features --features heic
      - uses: actions/upload-artifact@v4
        with:
          name: banana-rs-windows-x64
          path: target/release/banana-rs.exe
