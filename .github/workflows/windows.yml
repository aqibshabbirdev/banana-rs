# Builds and tests Banana Photos on Windows (x64), and keeps the result as an artifact.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths: ["src/**", "Cargo.*", "build.rs", "assets/**", "tests/**", ".github/workflows/windows.yml", "scripts/*windows*", "scripts/msix/**"]

jobs:
  build:
    runs-on: windows-latest
    env:
      # libheif (HEIC) from vcpkg, linked statically into the exe; built packages are cached.
      VCPKG_ROOT: C:\vcpkg
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-libheif-x64-windows-static-md-v1
      - name: libheif
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          vcpkg install libheif:x64-windows-static-md
      - name: Build
        run: cargo build --release --no-default-features --features heic
      - name: Test
        run: cargo test --release --no-default-features --features heic
      - uses: actions/cache@v4
        with:
          path: dist/win/models
          key: models-${{ hashFiles('scripts/fetch-models.sh') }}
      - name: Models
        shell: bash
        run: scripts/fetch-models.sh dist/win/models
      # The runner has no GPU, like the Microsoft Store's test machines: the app has to open its
      # window and stay up there. OpenGL is tried too, only to show what it does on such a PC.
      - name: Launch
        run: |
          function Launch($renderer) {
            $data = "$env:RUNNER_TEMP\launch-$renderer"
            New-Item -ItemType Directory -Force "$data\lib" | Out-Null
            Set-Content "$data\last_folder" "$data\lib" -NoNewline
            $env:BANANA_DATA = $data
            $env:BANANA_RENDERER = $renderer
            $p = Start-Process target/release/banana-rs.exe -PassThru
            Start-Sleep 20
            $up = -not $p.HasExited
            if ($up) { Stop-Process $p.Id -Force } else { Write-Host "$renderer exited with $($p.ExitCode)" }
            if (Test-Path "$data\startup-error.txt") { Write-Host "${renderer}: $(Get-Content "$data\startup-error.txt")" }
            Write-Host "$renderer stayed up: $up"
            return $up
          }
          Launch glow | Out-Null
          if (-not (Launch wgpu)) { Write-Error "the app didn't stay open"; exit 1 }
      - name: Package (zip and installer)
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Copy-Item target/release/banana-rs.exe dist/win/
          Compress-Archive -Path dist/win/* -DestinationPath "dist/banana-rs-$version-windows-x64.zip" -Force
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /Q "/DVersion=$version" "/DSource=$pwd\dist\win" scripts/windows-installer.iss
          Get-ChildItem dist/*.zip, dist/*.exe | Format-Table Name, Length
      - name: MSIX (Microsoft Store)
        env:
          # From Partner Center (Product management › Product identity), as repository variables.
          MSIX_NAME: ${{ vars.MSIX_NAME || 'BananaPhotos.Test' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Banana Photos Test' }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY || 'Banana Photos (test)' }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $layout = "dist/msix-layout"
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          Copy-Item dist/win/banana-rs.exe $layout
          Copy-Item -Recurse -Force dist/win/models "$layout/models"
          Copy-Item assets/msix/*.png "$layout/Assets/"
          (Get-Content scripts/msix/AppxManifest.xml -Raw).Replace('$NAME$', $env:MSIX_NAME).Replace('$PUBLISHER$', $env:MSIX_PUBLISHER).Replace('$PUBLISHER_DISPLAY$', $env:MSIX_PUBLISHER_DISPLAY).Replace('$VERSION$', "$version.0") | Set-Content "$layout/AppxManifest.xml"
          $bin = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          & "$bin\makeappx.exe" pack /o /d $layout /p "dist/BananaPhotos-$version-x64.msix"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A copy signed with a throwaway certificate, installed here to check the package.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Copy-Item "dist/BananaPhotos-$version-x64.msix" "dist/msix-test.msix"
          & "$bin\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint "dist/msix-test.msix"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Export-Certificate -Cert $cert -FilePath dist/msix-test.cer | Out-Null
          Import-Certificate -FilePath dist/msix-test.cer -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          Add-AppxPackage -Path "dist/msix-test.msix"
          $installed = Get-AppxPackage -Name $env:MSIX_NAME
          if (-not $installed) { Write-Error "the package didn't install"; exit 1 }
          Write-Host "Installed $($installed.PackageFullName) at $($installed.InstallLocation)"
          Get-ChildItem $installed.InstallLocation | Format-Table Name, Length
          # Started the way the Store starts it, it has to stay up.
          Start-Process "shell:AppsFolder\$($installed.PackageFamilyName)!BananaPhotos"
          Start-Sleep 20
          $p = Get-Process banana-rs -ErrorAction SilentlyContinue
          if (-not $p) { Write-Error "the packaged app didn't stay open"; exit 1 }
          Write-Host "Packaged app running (pid $($p.Id))"
          Stop-Process -Name banana-rs -Force
          Start-Sleep 2
          Remove-AppxPackage $installed.PackageFullName
      - uses: actions/upload-artifact@v4
        with:
          name: banana-photos-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-x64-setup.exe
            dist/*-x64.msix
